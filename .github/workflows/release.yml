name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.3 or 1.2.3-beta.1 (tag v<version> is created on release)'
        required: true
        type: string
      create_release:
        description: 'Publish a GitHub Release (otherwise only build workflow artifacts)'
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          RAW: ${{ inputs.version || github.ref_name }}
        run: |
          v="${RAW#v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' is not a valid version (expected 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build portable zip and Velopack-ready publish (${{ matrix.arch }})
        shell: pwsh
        run: >
          ./tools/packaging/Build-Release.ps1
          -Arch ${{ matrix.arch }}
          -Version $env:VERSION
          -OutDir artifacts
          -PackageType Portable
          -NuGetConfig nuget.config

      - name: Fetch previous release packages for delta generation
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install -g vpk --version 1.2.161
          $pre = if ($env:VERSION.Contains('-')) { @('--pre') } else { @() }
          vpk '[win]' download github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN `
            --channel win-${{ matrix.arch }} --outputDir velopack-${{ matrix.arch }} @pre

      # Unsigned for now. To sign, add -SignParams (signtool args) or -AzureTrustedSignFile here; see RELEASING.md.
      - name: Pack Velopack installer and update packages (${{ matrix.arch }})
        shell: pwsh
        run: |
          dotnet tool update -g vpk --version 1.2.161
          ./tools/packaging/Pack-Velopack.ps1 -Arch ${{ matrix.arch }} -Version $env:VERSION -OutDir velopack-${{ matrix.arch }}
          Copy-Item velopack-${{ matrix.arch }}\* artifacts -Force

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  package:
    needs: [version, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true

      - name: Write download guidance and checksum release files
        shell: pwsh
        run: >
          ./tools/packaging/Bundle-Release.ps1
          -Version $env:VERSION
          -Directory artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [version, package]
    if: github.event_name == 'push' || inputs.create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: artifacts

      - name: Create or update GitHub Release
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          mapfile -t files < <(find artifacts -maxdepth 1 -type f ! -name release-notes.md)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "WSLc Desktop Manager $TAG" --generate-notes --notes-file artifacts/release-notes.md "${flags[@]}"
          fi
